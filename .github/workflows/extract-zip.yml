name: Extract zip

on:
  push:
    branches: [main]
    paths:
      - '*.zip'

permissions:
  contents: write

concurrency:
  group: extract-zip
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip found"
            exit 0
          fi
          for z in "${zips[@]}"; do
            tmp=$(mktemp -d)
            unzip -q "$z" -d "$tmp"
            rm -rf "$tmp/__MACOSX"
            src="$tmp"
            mapfile -t entries < <(find "$tmp" -mindepth 1 -maxdepth 1)
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
              src="${entries[0]}"
            fi
            rm -rf "$src/.git" "$src/.github"
            cp -a "$src"/. .
            git rm -q -f "$z"
          done

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Extract uploaded zip"
          git push
